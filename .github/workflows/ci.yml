name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install frontend tooling
        run: npm ci
      - name: Lint
        run: make lint
      - name: Unit tests, race detector and coverage
        run: go test -race -coverprofile=coverage.out ./api ./app ./cmd/... ./database ./internal/...
      - name: Coverage gate
        run: npm run check:coverage
      - name: Build
        run: go build ./api ./app ./cmd/... ./database ./internal/...
      - name: Web performance budget
        run: npm run check:size
      - name: License policy
        run: npm run check:licenses

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install test tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        env:
          APP_ENV: development
          APP_PORT: "8181"
          COOKIE_SECURE: "false"
          SESSION_TTL_HOURS: "12"
          TIDB_DATA_SERVICE_BASE_URL: https://example.invalid
          TIDB_DATA_APP_ID: ci-test
          TIDB_DATA_API_PUBLIC_KEY: ci-test
          TIDB_DATA_API_PRIVATE_KEY: ci-test
        run: |
          go run ./cmd/server > /tmp/maz-suplementos.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8181/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/maz-suplementos.log
          exit 1
      - name: Browser smoke test
        env:
          TARGET_URL: http://127.0.0.1:8181
          PW_HEADLESS: "true"
        run: npm run test:e2e
      - name: Accessibility test
        env:
          TARGET_URL: http://127.0.0.1:8181
        run: npm run test:a11y
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-artifacts
          path: test-artifacts/
          if-no-files-found: ignore

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Reachable vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-package: ./...
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.178.0
      - name: Semgrep rules
        run: semgrep scan --config .semgrep.yml --error

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Generate Go SBOM
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 mod -json -output sbom-go.json
      - name: Generate npm SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-node.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom-*.json
